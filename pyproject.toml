[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["N999"]

[tool.mypy]
python_version = "3.14"
files = ["autopader"]
check_untyped_defs = true
warn_unused_configs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["pandas.*", "openpyxl.*", "dotenv.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
